<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processador Universal de CSV</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        .painel { background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #ddd; }
        .grupo { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-weight: bold; }
        input, select, button { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; margin-top: 10px; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .escondido { display: none; }
    </style>
</head>
<body>

    <h2>Processador Universal de CSV</h2>

    <div class="painel">
        <form id="formFiltro">
            <div class="grupo">
                <label>1. Envie seu arquivo CSV:</label>
                <input type="file" id="arquivoCsv" accept=".csv" required>
            </div>

            <div class="grupo">
                <label>2. Escolha a ação:</label>
                <select id="tipoFiltro">
                    <option value="remover_nulos">Limpeza: Remover linhas com dados em branco</option>
                    <option value="remover_duplicatas">Limpeza: Remover linhas repetidas</option>
                    <option value="filtro_exato">Busca: Encontrar valores exatos em uma coluna</option>
                </select>
            </div>

            <div id="camposFiltroExato" class="escondido">
                <div class="grupo">
                    <input type="text" id="coluna" placeholder="Nome da Coluna (ex: Categoria)">
                </div>
                <div class="grupo">
                    <input type="text" id="valor" placeholder="Valor a procurar (ex: Eletrônicos)">
                </div>
            </div>

            <button type="submit">Processar e Baixar CSV</button>
        </form>
    </div>

    <script>
        const selectFiltro = document.getElementById('tipoFiltro');
        const divCamposExatos = document.getElementById('camposFiltroExato');

        // Escuta o menu dropdown para esconder ou mostrar os campos de texto
        selectFiltro.addEventListener('change', () => {
            if (selectFiltro.value === 'filtro_exato') {
                divCamposExatos.classList.remove('escondido');
            } else {
                divCamposExatos.classList.add('escondido');
            }
        });

        document.getElementById('formFiltro').addEventListener('submit', async (e) => {
            e.preventDefault();

            const arquivo = document.getElementById('arquivoCsv').files[0];
            const tipoFiltro = selectFiltro.value;
            
            const formData = new FormData();
            formData.append('file', arquivo);
            formData.append('tipo_filtro', tipoFiltro);
            
            // Só anexa a coluna e o valor se a opção de filtro exato foi a escolhida
            if (tipoFiltro === 'filtro_exato') {
                formData.append('coluna', document.getElementById('coluna').value);
                formData.append('valor', document.getElementById('valor').value);
            }

            try {
                const resposta = await fetch('/api/processar-dados', {
                    method: 'POST',
                    body: formData
                });

                if (!resposta.ok) {
                    const erro = await resposta.json();
                    alert("Erro: " + erro.detail);
                    return;
                }

                // --- Lógica de Download Automático ---
                // Transforma a resposta em um "Blob" (arquivo bruto em memória)
                const blob = await resposta.blob();
                
                // Cria um link temporário falso no navegador e clica nele sozinho para baixar
                const url = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                
                // Tenta ler o nome do arquivo que a API enviou (ex: modificado_vendas.csv)
                let nomeArquivo = "arquivo_processado.csv";
                const disposition = resposta.headers.get('Content-Disposition');
                if (disposition && disposition.includes('filename=')) {
                    nomeArquivo = disposition.split('filename=')[1];
                }

                link.download = nomeArquivo;
                document.body.appendChild(link);
                link.click(); // Força o download
                link.remove();
                window.URL.revokeObjectURL(url);

            } catch (erro) {
                alert("Erro de conexão com o servidor.");
                console.error(erro);
            }
        });
    </script>
</body>
</html>
